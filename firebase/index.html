<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Firebase FCM Test</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 900px;
        margin: 50px auto;
        padding: 20px;
      }

      button {
        padding: 12px 20px;
        font-size: 16px;
        cursor: pointer;
      }

      #status {
        margin-top: 20px;
        font-weight: bold;
      }

      #token {
        margin-top: 20px;
        padding: 15px;
        background: #f4f4f4;
        border: 1px solid #ddd;
        word-break: break-all;
        white-space: pre-wrap;
      }
    </style>
  </head>

  <body>
    <h1>Firebase FCM Test</h1>

    <button id="generateToken">Generate FCM Token</button>

    <div id="status"></div>

    <div id="token"></div>

    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';

      import {
        getMessaging,
        getToken,
      } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-messaging.js';

      // ==========================================
      // 1. REPLACE THESE VALUES
      // ==========================================

      const firebaseConfig = {
        apiKey: 'AIzaSyAz8XfF_1t-GXhejgtLhpCEJ_GpciGv1ks',
        authDomain: 'event-management-27772.firebaseapp.com',
        projectId: 'event-management-27772',
        storageBucket: 'event-management-27772.firebasestorage.app',
        messagingSenderId: '730518034910',
        appId: '1:730518034910:web:8cd56cf25b3871cd07654f',
      };

      // ==========================================
      // 2. REPLACE THIS VALUE
      // ==========================================

      const vapidKey =
        'BORqcPD4z9T-zikhhqJyZuH6Kr4LFDPIpwbiee94oGV52ledOZbB8MV4z_rnwEFHoBkavANPuUf04FXK0iuxjuU';

      // ==========================================
      // 3. INITIALIZE FIREBASE
      // ==========================================

      const app = initializeApp(firebaseConfig);

      const messaging = getMessaging(app);

      // ==========================================
      // 4. GENERATE FCM TOKEN
      // ==========================================

      document
        .getElementById('generateToken')
        .addEventListener('click', async () => {
          const status = document.getElementById('status');

          const tokenElement = document.getElementById('token');

          try {
            status.textContent = 'Requesting notification permission...';

            const permission = await Notification.requestPermission();

            if (permission !== 'granted') {
              status.textContent = 'Notification permission was denied.';

              return;
            }

            status.textContent = 'Generating FCM token...';

            //getToken function provided by fcm web messaging

            const token = await getToken(messaging, {
              vapidKey,
            });

            if (!token) {
              status.textContent = 'FCM token was not generated.';

              return;
            }

            console.log('FCM TOKEN:', token);

            tokenElement.textContent = token;

            status.textContent = 'FCM token generated successfully.';
          } catch (error) {
            console.error('FCM Error:', error);

            status.textContent = `Error: ${error.message}`;
          }
        });
    </script>
  </body>
</html>
<!-- 
Voluntary Application Server Identification
For Web Push, the browser needs to know that your web application is authorized to use push notifications.
The VAPID public key is part of that Web Push setup. -->
